name: Refresh prices and deploy

on:
  schedule:
    - cron: "17 5 * * *" # elke dag 05:17 UTC
  workflow_dispatch: # handmatig starten vanuit het Actions-tabblad
  push:
    branches: [main] # TIJDELIJK: eenmalige testrun, wordt hierna verwijderd

permissions:
  contents: write # nodig om data/plans.json terug te committen

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch current prices
        run: node scripts/ingest.mjs

      # Stopt de workflow als de data er dun of verouderd uitziet: dan blijft de vorige versie live.
      - name: Check the data before deploying
        run: node scripts/check-data.mjs

      # Dagsnapshot toevoegen aan de prijsgeschiedenis (na de data-check, zodat kapotte data niet logt).
      - name: Log price history
        run: node scripts/log-prices.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/plans.json data/price-history.json
          git diff --staged --quiet || git commit -m "data: refresh prices + history"
          git push

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://gbscout.com
          NEXT_PUBLIC_OPERATOR_NAME: ${{ vars.NEXT_PUBLIC_OPERATOR_NAME }}
          NEXT_PUBLIC_OPERATOR_ADDRESS: ${{ vars.NEXT_PUBLIC_OPERATOR_ADDRESS }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          AFF_AIRALO: ${{ secrets.AFF_AIRALO }}
          AFF_YESIM: ${{ secrets.AFF_YESIM }}
          AFF_UBIGI: ${{ secrets.AFF_UBIGI }}
          AFF_HOLAFLY: ${{ secrets.AFF_HOLAFLY }}
          AFF_SAILY: ${{ secrets.AFF_SAILY }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
